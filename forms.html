<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <label for="rollno">Roll No</label>
        <input type="text" id="rollno"><br>
        <label for="stdname">Student Name</label>
        <input type="text" id="stdname" placeholder="fistname">
        <input type="text" placeholder="secondname"><br>
        <label for="father">Father Name</label>
        <input type="text" id="father"><br>
        <label>DOB</label>
        <input type="date"><br>
        <label>Mobile No</label>
        <input type="tel"><br>
        <label>Email Id:</label>
        <input type="text" placeholder="abc@gmail.com"><br>
        <label>Password</label>
        <input type="password"><br>
        <label>Gender</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female <br>
        <label>Department</label>
        <input type="radio" name="department">CSE
        <input type="radio" name="department">IT
        <input type="radio" name="department">ECE
        <input type="radio" name="department">EEE
        <input type="radio" name="department">Mech
        <input type="radio" name="department">Civil<br>
        <label>Course:</label>
        <select name="" id="">
            <option value="">--courses--</option>
            <option value="">Python</option>
            <option value="">Java</option>
            <option value="">Pip</option>
            <option value="">Ai/Ml</option>
        </select><br>
        <label for="">Photo:</label>
        <input type="file"><br>
        <label for="">City:</label>
        <input type="text">


        

        



    </form>


</body>
</html>
